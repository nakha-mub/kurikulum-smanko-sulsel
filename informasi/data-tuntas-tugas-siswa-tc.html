<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Ketuntasan Tugas Siswa TC - SMANKO SULSEL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 15px 0px; font-family: sans-serif; }
    .card-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .table-responsive { height: 400px; overflow-y: auto; }
    
    /* Warna cyan khas spreadsheet */
    .table-cyan th { 
      background-color: #00ffff !important; 
      color: #333; 
      text-align: center; 
      vertical-align: middle;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #dee2e6;
		/* Properti utama untuk wrap teks */
		/* white-space: nowrap;*/
		white-space: normal;
		word-wrap: break-word;
		overflow-wrap: break-word;
    }

    .table-responsive thead th {
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    .table td { font-size: 13px; vertical-align: middle; white-space: nowrap; }
    .text-center-cell { text-align: center; }
    
    /* Variasi status visual */
    .status-tuntas { color: #28a745; font-weight: bold; font-size: 16px; }
    .status-belum { color: #ccc; }
    .text-kustom { font-weight: 500; color: #495057; }
    
    /* Style kustom untuk tombol navigasi tab */
    .nav-pills .nav-link.active { background-color: #00cccc; color: white; }
    .nav-pills .nav-link { color: #555; font-weight: bold; margin-right: 5px; border: 1px solid #dee2e6; }
    .nav-info-text { font-size: 13px; color: #666; font-weight: 500; display: flex; align-items: center; }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="card-container">
    <h3 class="mb-1 fw-bold text-uppercase" style="font-size: 20px; text-align: center;">Daftar Ketuntasan Tugas Mata Pelajaran</h3>
    <h4 class="mb-4 text-muted text-uppercase" style="font-size: 16px; text-align: center;">Siswa TC - SMANKO SULSEL</h4>
    
    <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="btn-sheet1" onclick="gantiSheet('sheet1')">Sheet 1</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="btn-sheet2" onclick="gantiSheet('sheet2')">Sheet 2</button>
      </li>
      <li class="nav-item d-flex align-items-center ms-2" role="presentation">
        <span class="nav-link nav-info-text bg-light text-dark">Tanda ✔ : Tugas Sudah Selesai</span>
      </li>
      <li class="nav-item d-flex align-items-center ms-2" role="presentation">
        <span class="nav-link nav-info-text bg-light text-dark">Tanda - : Tugas Belum Dikerjakan</span>
      </li>
      <li class="nav-item d-flex align-items-center ms-2" role="presentation">
        <span class="nav-link nav-info-text bg-light text-dark">Tanda X : Kelas tersebut tidak ada Mata Pelajaran itu</span>
      </li>
    </ul>
    
    <div id="loading" class="text-center my-4">
      <div class="spinner-border text-info" role="status"></div>
      <p class="mt-2">Sinkronisasi data Google Sheets...</p>
    </div>

    <div class="table-responsive d-none" id="tabel-area">
      <table class="table table-bordered table-striped table-hover m-0">
        <thead class="table-cyan" id="tabel-header">
        </thead>
        <tbody id="tabel-bodi">
        </tbody>
      </table>
    </div>
    
  </div>
</div>

<script>
  // PENTING: Tempelkan URL Web App (berakhiran /exec) hasil deploy dari Langkah 1 ke sini
  const webAppUrl = 'https://script.google.com/macros/s/AKfycbz5TxxJkM37rABmAfzQUjnw1aYd7N-_j6Q7Y4Szib_i1EbsmSPJ3WzDn0o62ZS7-obrjA/exec';

  let databaseMaster = {};

  window.addEventListener('load', muatDataAwal);

  // Menggunakan Fetch API standar untuk mengambil data dari server Google luar
  async function muatDataAwal() {
    try {
      const response = await fetch(webAppUrl);
      databaseMaster = await response.json();
      
      // Mengubah nama teks tombol sesuai nama asli tab di Google Sheets
      document.getElementById('btn-sheet1').innerText = databaseMaster.sheet1.nama;
      document.getElementById('btn-sheet2').innerText = databaseMaster.sheet2.nama;
      
      // Tampilkan data sheet 1 secara default
      renderTabel('sheet1');
      
      // Sembunyikan loader & munculkan tabel
      document.getElementById('loading').classList.add('d-none');
      document.getElementById('tabel-area').classList.remove('d-none');
    } catch (error) {
      console.error("Error mengambil data:", error);
      document.getElementById('loading').innerHTML = `
        <p class="text-danger fw-bold">Gagal sinkronisasi data!<br>
        Pastikan URL Aplikasi Web sudah benar dan aksesnya diatur ke "Anyone".</p>
      `;
    }
  }

  function gantiSheet(target) {
    if (target === 'sheet1') {
      document.getElementById('btn-sheet1').classList.add('active');
      document.getElementById('btn-sheet2').classList.remove('active');
    } else {
      document.getElementById('btn-sheet1').classList.remove('active');
      document.getElementById('btn-sheet2').classList.add('active');
    }
    renderTabel(target);
  }

  function renderTabel(sheetKey) {
    let headers = databaseMaster[sheetKey].headers;
    let rows = databaseMaster[sheetKey].data;
    
    // 1. Render Bagian Kepala Tabel
    let headerHtml = '<tr>';
    headers.forEach(header => {
      headerHtml += `<th>${header !== "" ? header : "-"}</th>`;
    });
    headerHtml += '</tr>';
    document.getElementById('tabel-header').innerHTML = headerHtml;
    
    // 2. Render Bagian Isi Baris Data
    let bodyHtml = '';
    rows.forEach(row => {
      bodyHtml += '<tr>';
      
      row.forEach((cellValue, index) => {
        // Kolom 0-3 (Identitas Siswa)
        if (index < 4) {
          let centerClass = (index === 0 || index === 1) ? 'text-center-cell' : '';
          bodyHtml += `<td class="${centerClass}">${cellValue !== "" ? cellValue : "-"}</td>`;
        } 
        // Kolom Mapel
        else {
          let stringVal = cellValue.toString().toUpperCase().trim();
          
          if (cellValue === "" || cellValue === false || stringVal === "FALSE") {
            bodyHtml += `<td class="text-center-cell status-belum">-</td>`;
          } else if (cellValue === true || stringVal === "TRUE") {
            bodyHtml += `<td class="text-center-cell status-tuntas">✔</td>`;
          } else {
            bodyHtml += `<td class="text-center-cell text-kustom">${cellValue}</td>`;
          }
        }
      });
      
      bodyHtml += '</tr>';
    });
    
    document.getElementById('tabel-bodi').innerHTML = bodyHtml;
  }
</script>

</body>
</html>
